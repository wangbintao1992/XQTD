server:
  address: ${BIND_ADDRESS:0.0.0.0}
  port: ${PORT:8080}

spring:
  application:
    name: xqtd-leaderboard
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/leaderboard;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
